capabilities: >-
  Exposes the Project's native visual-builder model for agents: semantic visual
  editing, design-system-aware styling, dynamic content authoring, project quality
  audits, visual verification, asset workflows, shared content authoring, draft-page
  verification, and publishing. Destructive operations require explicit confirmation
  bound to reviewed dry runs, with validation of semantic inputs and rejection of
  invalid references.
