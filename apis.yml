aid: webstudio
name: Webstudio
description: >-
  Webstudio is an advanced open-source visual website builder and Webflow
  alternative that lets designers and developers build fast, maintainable
  websites using modern web standards without writing code. It offers full CSS
  editing, CSS Grid and Flexbox layout, scroll-driven animations, design tokens,
  a CMS that connects to any HTTP API (Supabase, Airtable, WordPress, Notion,
  Hygraph, Baserow), webhook forms, and one-click publishing to Webstudio's cloud
  (Cloudflare) or self-hosting on Vercel, Netlify, Cloudflare Pages, or Docker.
  Its developer surface is agent-native: the `webstudio` CLI links, syncs, builds,
  audits, and publishes projects, and ships a first-party MCP server that exposes
  the Project's native visual-builder model to AI clients (Claude, Codex, Cursor,
  VS Code). Backed by Seedcamp.
